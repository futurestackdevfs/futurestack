services:
  - type: web
    name: futurestack-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npx pnpm install && npx pnpm --filter api exec prisma generate && npx pnpm --filter api build
    startCommand: npx pnpm --filter api start:prod
    envVars:
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AGENTMAIL_API_KEY
        sync: false
      - key: AGENTMAIL_INBOX_ID
        value: "FutureStack <onboarding@agentmail.to>"
      - key: CONTACT_EMAIL
        sync: false
      - key: VDOCIPHER_API_KEY
        sync: false
      - key: VDOCIPHER_WEBHOOK_SECRET
        sync: false
      # AI blog-article generation (Claude), in-process — see apps/api/src/ai and
      # apps/api/src/blog/pipeline. No separate service/deploy needed.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: ANTHROPIC_EFFORT
        value: low
      - key: ANTHROPIC_RESEARCH_EFFORT
        value: low
      - key: ANTHROPIC_MAX_TOKENS
        value: "3000"
      - key: MAX_CONCURRENT_GENERATIONS
        value: "1"
      - key: MAX_GENERATIONS_PER_DAY
        value: "10"
